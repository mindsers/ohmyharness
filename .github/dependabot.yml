version: 2

updates:
  # Patch and minor bumps arrive as one grouped PR so a quiet week is one
  # review, not six. Majors come separately — they deserve to be read.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The documentation site in docs/: Astro, Starlight and what they bring. The
  # lockfile is what CI and a release install from, so nothing here changes
  # what is built until one of these pull requests merges.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Every workflow pins every action by commit, with the version in a trailing
  # comment, and tests/workflows.rs holds them to it: ci.yml decides what
  # merges, release.yml and docs.yml build what ships and what readers are
  # served. Dependabot reads the comment and moves the pin as a pull request
  # that shows the new commit.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
