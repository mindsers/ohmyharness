name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A force-push should not leave the previous run burning a runner.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux gets the whole suite. Every test in tests/cli.rs shells out to the
  # real binary; one of them runs `omh init`, which builds the base image
  # through Docker. Everything else is in-process.
  test-linux:
    name: tests (linux, full suite)
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v5
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      - name: run every test, including the one that needs docker
        run: cargo test --locked

  # GitHub's macOS runners have no Docker daemon, so the test that needs one is
  # excluded by target rather than skipped by name — a `--skip` list rots
  # silently the moment a test is renamed, and reads as coverage it is not.
  #
  # That drops the whole of tests/cli.rs here, and only one of those tests
  # actually needs Docker — a little macOS coverage traded for a boundary that
  # cannot go stale. Worth revisiting if tests/cli.rs grows.
  #
  # Deliberately no test count: the first version of this comment carried one,
  # and a later commit in the same pull request added four tests and left it
  # wrong. A number nothing recomputes is a number that lies on a schedule.
  test-macos:
    name: tests (macos, no docker)
    runs-on: macos-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v5
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      - name: run every test that does not need docker
        run: cargo test --locked --bins --test docs

  lint:
    name: format and lint
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v5
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      - name: check formatting
        run: cargo fmt --check
      - name: lint, with warnings as errors
        run: cargo clippy --locked --all-targets -- -D warnings

  # The MSRV in Cargo.toml is a claim about who can build this, and an unchecked
  # claim is the thing this repo distrusts most. This job is what makes it true.
  msrv:
    name: msrv (builds on 1.85)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml, which otherwise pins this job to stable.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - name: check out the repo
        uses: actions/checkout@v5
      - name: install rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      - name: check it still builds on the floor omh declares
        run: cargo check --locked --all-targets
