name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A force-push should not leave the previous run burning a runner.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Names lead with the verb for what the job does — run, check, build — with
# the varying part in parentheses, matching release. Read in a checks list,
# where anything longer than a glance is wasted.
#
# Unlike release, these are the required status checks on main: renaming one
# means updating branch protection in the same breath, or the rule waits on a
# name nothing produces. That happened: `build (msrv 1.85)` became `build (msrv
# 1.88)` with the bump, nothing produced the old name, and every merge after it
# went through the admin bypass with no required check enforced. So no name
# here carries a version (tests/workflows.rs holds that).
#
# Every action is pinned to a commit, with its version in a trailing comment
# for Dependabot, and every job has a timeout: the default is six hours.
jobs:
  # `--include-ignored` below opts back in to the tests that need something the
  # default run cannot assume: the ones in tests/cli.rs that build the base
  # image through Docker, and the ones in src/render.rs that put omh's
  # generated JavaScript through `node --check`.
  test-linux:
    name: run tests (linux, with docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: run every test
        run: cargo test --locked -- --include-ignored

  # GitHub's macOS runners have no Docker daemon. This runs the same command a
  # contributor runs, and the tests that need Docker report themselves as
  # ignored rather than being excluded by target — so a new integration test is
  # covered here by default instead of silently dropping off macOS, and nothing
  # has to remember to update a skip list.
  test-macos:
    name: run tests (macos)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: run every test that does not need a container runtime
        run: cargo test --locked
      # Ignored for the network it needs, not for Docker, and its real arm is
      # macOS-only: Linux merges shipped and installed roots, so there it only
      # checks the refusal. Without this step that arm ran in no job.
      - name: run the TLS check's macOS arm, against a real handshake
        run: cargo test --locked --bin omh -- --include-ignored --exact doctor::tests::a_private_root_reads_as_private_and_a_public_one_does_not

  lint:
    name: check formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: check formatting
        run: cargo fmt --check
      # `--features e2e`: tests/e2e is `required-features`, so `--all-targets`
      # alone leaves it out, and the suite nightly runs was compiled by nothing
      # on a push — a pull request could break it and land green.
      - name: lint, with warnings as errors
        run: cargo clippy --locked --all-targets --features e2e -- -D warnings

  # install.sh runs before omh does, on a machine nobody has checked, and it is
  # the only file here that no compiler reads. scripts/check.sh is the second
  # such file and is held to the same bar: it is what a contributor runs
  # instead of clippy, so a break in it takes the local lint down silently —
  # which is the exact failure it was written to stop.
  installer:
    name: check installer (shellcheck and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: shellcheck it
        run: shellcheck install.sh scripts/test-install.sh scripts/check.sh scripts/test-check.sh
      - name: exercise check.sh's toolchain guard
        run: ./scripts/test-check.sh
      - name: build the binary the tests package
        run: cargo build --locked
      - name: exercise every path it can take
        run: ./scripts/test-install.sh

  # tests/docs.rs holds the pages' links, in every test job above, because the
  # site's own build checks none of them. What only a build can say is whether
  # these are pages the site can publish at all: front matter it can parse, a
  # configuration that loads, a lockfile that still installs. The same install
  # and build as docs.yml, which is the one that publishes.
  docs:
    name: build (documentation site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # each page shows when it last changed, read from git
      - name: install node and pnpm, at the versions docs/mise.toml pins
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          working_directory: docs
      - name: install the site's dependencies, exactly as locked
        run: pnpm install --frozen-lockfile
      # GitHub's dependency graph reads only the first document of
      # pnpm-lock.yaml — the pnpm binaries — so Dependabot raises no alert for
      # anything the site actually installs. This is what does.
      - name: check the site's dependencies for advisories
        run: pnpm audit
      - name: check the site's types
        run: pnpm typecheck
      - name: build the site
        run: pnpm build

  # The MSRV in Cargo.toml is a claim about who can build this, and an unchecked
  # claim is the thing this repo distrusts most. `build` rather than `check`,
  # because the job says "builds" and `cargo check` stops before codegen.
  #
  # Named without the version: the name is a required check, and one that said
  # `1.88` was renamed by the bump that moved the floor.
  msrv:
    name: build (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Overrides rust-toolchain.toml, which otherwise pins this job to stable.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build on the floor omh declares
        run: cargo build --locked --all-targets --features e2e

  # Every RustSec advisory that names a crate in Cargo.lock, every licence, and
  # where each crate comes from, against deny.toml. Not a required check: an
  # advisory published overnight would otherwise block every pull request,
  # including the one that fixes it.
  deny:
    name: check dependencies (advisories and licences)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check every crate in the lock
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
