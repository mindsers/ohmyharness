# The sweep, once a day, against whatever the world looks like that morning.
#
# `verify` runs the same tests on every push, so this is not about the code:
# it is about everything the code sits on. The base image is `node:22-trixie-
# slim` by tag, Docker moves, and the harnesses' own installers run at image
# build time — none of which a pull request changes, and all of which have
# broken a launch here before. A nightly run puts a date on the last time omh
# was known to work end to end.
name: nightly

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

on:
  schedule:
    # 04:00 UTC, which is nobody's working hour in the timezones this is
    # developed in — a failure is read with coffee rather than mid-review.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sweep:
    name: every command, against a real container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out the repo
        uses: actions/checkout@v7
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      - name: run every test, including the ones that need Docker
        run: cargo test --locked -- --include-ignored

  # `cargo install omh` reads no Cargo.lock: it resolves every dependency
  # afresh, from whatever crates.io holds that morning. The msrv job in ci.yml
  # builds from the lock, so it says nothing about that. This does what a user
  # on the oldest Rust omh declares does, and goes red the morning a release a
  # dependency published would make their install fail.
  install-msrv:
    name: cargo install on the floor omh declares (rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Overrides rust-toolchain.toml, which otherwise pins this to stable.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - name: check out the repo
        uses: actions/checkout@v7
      - name: install rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - name: install omh as cargo install would, with no lockfile
        run: cargo install --path . --root "$RUNNER_TEMP/omh"

  # Every harness omh supports, at the version adapters/ pins and in the image
  # omh builds for it, driven through real turns against a fake model:
  # tests/e2e. Behind the `e2e` feature, so the sweep above and every push
  # leave it out. One job per harness: a failure names its harness, and each
  # session's network comes from its own runner's address pool.
  e2e:
    name: every feature (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, omp, opencode]
    steps:
      - name: check out the repo
        uses: actions/checkout@v7
      - name: restore the cargo cache
        uses: Swatinem/rust-cache@v2
      # `--exact` with a name no test carries runs nothing and passes:
      # `0 passed; 4 filtered out`, exit 0. A harness renamed in `adapters/`
      # and not here would go green every night having run nothing, so the
      # name is asked for first. Into a variable rather than piped to
      # `grep -q`: Actions runs bash with `pipefail`, and a grep that quits at
      # its first match can fail the listing with SIGPIPE.
      - name: run every scenario against ${{ matrix.harness }}
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          listed="$(cargo test --locked --features e2e --test e2e -- --list --exact "$HARNESS")"
          grep -qx "$HARNESS: test" <<<"$listed" \
            || { echo "no e2e test is called $HARNESS"; exit 1; }
          cargo test --locked --features e2e --test e2e -- --exact "$HARNESS"
