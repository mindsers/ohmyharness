name: docs

# Publishes the documentation site (docs/) to GitHub Pages, served at
# https://docs.ohmyharness.sh.
#
# It runs when a release is tagged, so the site describes the release a reader
# can install rather than whatever main holds that week. It can also be run by
# hand from the Actions tab, which publishes the branch or tag chosen there.
#
# Set up once, in the repository's settings:
#
#   Pages > Source: GitHub Actions
#   Pages > Custom domain: docs.ohmyharness.sh, then Enforce HTTPS
#   Environments > github-pages > Deployment branches and tags: add `v*`
#
# The last one is the one that fails quietly. Out of the box the environment
# accepts deployments from the default branch only, so a tag builds the site,
# uploads it, and is then refused at the publish step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Building the site is the only way to know this file works, and a release is
  # a bad time to find out. A pull request that edits it runs the build and
  # publishes nothing — the publishing job is gated below.
  pull_request:
    paths:
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned by commit here, with the version in a trailing comment,
# the way release pins its cache: this workflow builds what readers are served.
# Dependabot moves them, as a pull request that shows the new commit.
jobs:
  build:
    name: build (documentation site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # each page shows when it last changed, read from git
          persist-credentials: false
      # No cache: nothing restored from another run can end up on the site.
      - name: install node and pnpm, at the versions docs/mise.toml pins
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          working_directory: docs
          cache: false
      - name: install the site's dependencies, exactly as locked
        run: pnpm install --frozen-lockfile
      - name: build the site
        run: pnpm build
      - name: hand the built site to the publishing job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  publish:
    name: publish (github pages)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow
    steps:
      - name: read the pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: publish the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
