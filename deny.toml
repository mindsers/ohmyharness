# `cargo deny check`, on every push (ci.yml). What a dependency may be, before
# it can be built into a release: no known advisory, a licence omh can ship,
# and nowhere but crates.io to come from.

[advisories]
# Every RustSec advisory that names a crate in Cargo.lock fails the check,
# unmaintained ones included. An advisory omh cannot act on yet goes here with
# its id and the reason, never silently.
ignore = []

[licenses]
# The licences in the tree today. Each is permissive and asks for its notice to
# travel with the binary, which release.yml does: THIRD-PARTY-NOTICES, from
# cargo-about, whose about.toml accepts this same list. MPL-2.0 is file-level
# copyleft and covers only option-ext's own files, which omh does not modify.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two majors of one crate are a cost, not a hazard (syn 2 and 3 are both here
# today, through different proc-macros). A wildcard version is a hazard.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
