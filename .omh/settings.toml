# What this repo decided. Settings at the top level; `[omh]` switches
# omh's own features off here without uninstalling anything.
#
# Untracked files the worktree needs — a worktree holds only tracked
# files, so without this the agent lands somewhere that cannot run your
# app. This is the ONLY path by which a secret reaches the agent, so
# keep it short and explicit. node_modules belongs in the image, not here.
#
# carry_in = [".env.local", "certs/"]
carry_in = []

# What this repo takes from your catalogue. `omh init` writes this expanded
# from whatever the machine that ran it happened to hold — which for the author
# was nothing, so committing that verbatim would have handed every contributor
# an empty catalogue and no reason why. This project has no opinion about your
# skills, rules, commands or subagents, and `"*"` is how that is said.
#
# Hooks are the exception, and the only line here that is a decision: these two
# are this repo's own, in `.omh/hooks/`, and a contributor's personal hooks are
# not run by a project that never asked for them.
[use]
rules = ["*"]
skills = ["*"]
mcp = ["*"]
commands = ["*"]
subagents = ["*"]
hooks = ["rust-format", "rust-test"]

