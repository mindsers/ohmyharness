# The base set — omh's opinion, as data.
#
# This file is the single source of truth: `omh init` seeds from it and
# `omh why` explains from it, so the two cannot disagree about what is
# installed or why.
#
# Every entry states what it buys, what it costs, what was considered instead,
# and how to remove it. That is enforced by a test, not by good intentions —
# see `every_base_set_entry_states_its_case` in src/base.rs.
#
# Costs are MEASURED. Benefits are ARGUED. They are different kinds of claim
# and are never printed as though they were the same one.

version = "2026.08"

# ─────────────────────────────────────────────────────────────────────────────
# The code graph
# ─────────────────────────────────────────────────────────────────────────────

[[entry]]
name    = "codegraph"
kind    = "mcp"
feature = "codegraph"
since   = "2026.06"
because = "structural queries instead of re-grepping the repo every task"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"
command = "codebase-memory-mcp"

  [[entry.measured]]
  what  = "to index this repo, cold"
  value = "0.46s"
  how   = "index_repository --mode fast, 821 nodes / 3813 edges, in the sandbox"
  on    = "2026-08-06"

  [[entry.measured]]
  what  = "on disk"
  value = "3.4 MB"
  how   = "the graph volume after a cold index of this repo"
  on    = "2026-08-06"

  [[entry.instead_of]]
  name = "gitnexus"
  why  = "PolyForm-Noncommercial licence"

  [[entry.instead_of]]
  name = "codegraphcontext"
  why  = "needs a Neo4j service running"

  [[entry.instead_of]]
  name = "@sdsrs/code-graph"
  why  = "close second; needs a node runtime rather than a static binary"

# ─────────────────────────────────────────────────────────────────────────────
# The hooks that make the graph something used rather than merely installed
# ─────────────────────────────────────────────────────────────────────────────

[[entry]]
name    = "graph-orient"
kind    = "hook"
feature = "codegraph"
since   = "2026.08"
because = "the agent is given the module map instead of discovering it by reading files"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"

  [[entry.measured]]
  what  = "per context rebuild"
  value = "2,300 B"
  how   = "get_architecture with four targeted aspects (2,138 B of payload) plus the hook's own framing prose"
  on    = "2026-08-06"

  [[entry.instead_of]]
  name = "the `overview` aspect"
  why  = "6,173 B for the same orientation the four targeted aspects give in 2,138"

[[entry]]
name    = "graph-first"
kind    = "hook"
feature = "codegraph"
since   = "2026.08"
because = "structural questions answer in one call instead of an iterative grep"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"

  [[entry.measured]]
  what  = "per grep"
  value = "243 B"
  how   = "the nudge string for a `repo-sNN` project name, computed from the literals the hook ships — see the_grep_nudges_declared_cost_matches_the_string_it_ships"
  on    = "2026-08-07"

  [[entry.instead_of]]
  name = "blocking grep outright"
  why  = "grep is right for a literal string, and a hook that blocks correct work gets disabled"

[[entry]]
name    = "graph-read"
kind    = "hook"
feature = "codegraph"
since   = "2026.08"
because = "one symbol instead of a whole file, when the file is big enough for that to matter"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"

  [[entry.measured]]
  what  = "when it fires"
  value = "1,511 B"
  how   = "get_code_snippet for one symbol, against reading the enclosing source file whole — this repo's largest was over 20x that. The file size is deliberately not recorded: it moves on every edit, and an earlier version of this line was already stale on the commit that wrote it."
  on    = "2026-08-06"

  [[entry.measured]]
  what  = "when it does not"
  value = "0 B"
  how   = "silent unless the target is source over 8,000 bytes"
  on    = "2026-08-06"

  [[entry.instead_of]]
  name = "nudging on every Read"
  why  = "Read is the most frequent tool there is; a nudge on every call becomes noise the model tunes out"

[[entry]]
name    = "graph-refresh"
kind    = "hook"
feature = "codegraph"
since   = "2026.08"
because = "the graph describes the code as it is now, not as the session found it"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"

  [[entry.measured]]
  what  = "per turn"
  value = "0.14s"
  how   = "incremental re-index of a session worktree at Stop"
  on    = "2026-08-06"

  [[entry.instead_of]]
  name = "indexing once at init"
  why  = "a session's worktree is not the checkout it started from; the graph would describe code the agent has since changed"

[[entry]]
name    = "graph-rules"
kind    = "rules"
feature = "codegraph"
since   = "2026.08"
because = "a graph the agent has not been told about is a graph it never queries — the four hooks fire while it is already doing something, and this is what is true before it starts"
remove  = "omh config mcp rm codegraph — the feature, server and hooks together"

  [[entry.measured]]
  what  = "in the agent's context, every turn"
  value = "673 B"
  how   = "the section as shipped, byte for byte. Computed by `every_rules_section_costs_what_it_says` against the string omh sends rather than typed in — a hand-written cost and the prose it describes have no relationship a test can check"
  on    = "2026-08-12"

  [[entry.instead_of]]
  name = "the graph-orient hook alone"
  why  = "orientation is re-paid at every context rebuild and describes the modules; this names the tools and the project variable once. Different claims, and the hook's 2,300 B is the one that repeats"

# ─────────────────────────────────────────────────────────────────────────────
# Git, which the sandbox now has one of its own
# ─────────────────────────────────────────────────────────────────────────────

[[entry]]
name    = "git-rules"
kind    = "rules"
feature = "git-notice"
since   = "2026.08"
because = "the sandbox has a repository of its own — its worktree's `.git` still points into the checkout omh never mounts, so omh mounts a gitdir it made instead. That gives the agent `status`, `diff`, `log`, `stash` and `reset --hard`, and puts a `.git` an editor attached over SSH can find. What the agent cannot work out on its own is whose repository it is: commits here are not the branch anyone reviews, and an agent that assumes otherwise reports work as delivered that nobody will ever see. Two more things it cannot work out: there is no history in that repository to read, and the branch it came from may move underneath it — both of which an agent otherwise reports as a broken checkout"
remove  = "nothing to uninstall — `git-notice = false` under `[omh]` in .omh/settings.toml"

  [[entry.measured]]
  what  = "in the agent's context, every turn"
  value = "993 B"
  how   = "the section as shipped, byte for byte, computed by `every_rules_section_costs_what_it_says`. It reads `shadow::ARRANGEMENT`, which the seed commit's message reads too, so the size is the same sentence a `git log` renders for free"
  on    = "2026-08-23"

  [[entry.instead_of]]
  name = "the git-unavailable hook, which shipped until 2026.08"
  why  = "it refused every shell command containing `git`, which was right while the worktree's pointer led nowhere and is a wall in front of the feature now that it does not. Retired rather than retargeted: with git working there is nothing left for it to intercept. Recorded under `rejected` so `omh why git-unavailable` still answers"

  [[entry.instead_of]]
  name = "a hook refusing `git push` alone"
  why  = "it would not contain anything, and nothing here does. The sandbox has `curl` and unrestricted egress, so a push was never the narrow way out — what a wall in front of it buys is orientation, not containment. git's own `pre-push` inside the shadow already provides that, in omh's words, on the path git itself walks the agent down: the error for a repository with no remote suggests `git remote add`. Measured 2026-08-19 against a reachable remote, every direction — the hook fires ahead of the transfer and the remote stays at zero commits; `git push --no-verify` and `git -c core.hooksPath=… push` both go straight past it and land one; and deleting the hook file worked until omh started mounting it read-only, which closes that third path and neither of the first two. A shell pattern would fare no better and would have to recognise a push across every shape an agent emits, which is how this set's pattern for matching `git` at all shipped broken once"

[[entry]]
name    = "git-note"
kind    = "hook"
feature = "git-notice"
since   = "2026.08"
because = "`omh sNN sync` changes the sandbox's files while the agent is stopped, and an agent that comes back to a tree it did not write has no way to find that out. Everything about the sync is already legible from inside — `git show HEAD` is what arrived, `git status` names what is left — but only to somebody who knows to look, and nothing about resuming a session suggests it. Without this the agent's first act is to re-derive a tree it thinks it knows, which is the silent-wrong-work case: it edits from what it remembers and trunk's changes disappear inside a plausible patch"
remove  = "nothing to uninstall — `git-notice = false` under `[omh]` in .omh/settings.toml, which turns off the git rules with it. `sync` still leaves its note in the gitdir afterwards; with nothing reading it, one small file sits there overwritten by each sync and read by nobody"

  [[entry.measured]]
  what  = "once, after a sync — and nothing at all otherwise"
  value = "234 B"
  how   = "`shadow::note_for(\"main\", 12, 2)` — a dozen commits and a couple of conflicts, the shape a sync after a week away produces — asserted byte for byte by `the_notes_declared_cost_matches_the_sentence_it_ships`. Not \"the widest shape\", because there is not one: the branch name is unbounded and so are both counts. On any other start the capture finds no file, `when` is false and nothing is injected — so unlike `graph-orient`, the only other hook at this moment, this one is not paid per context rebuild"
  on    = "2026-08-23"

  [[entry.instead_of]]
  name = "saying it in the rules section, which every turn pays for"
  why  = "the rules are the arrangement — permanently true things about whose repository this is. A sync is an event, and an event described in permanent prose is either absent when it happens or wrong for the rest of the session. The hook fires on the one start that follows a sync and is silent on every other"

  [[entry.instead_of]]
  name = "leaving the agent to find the `base moved to <sha>` commit itself"
  why  = "that commit is written either way and is the fuller answer — this only says to go and read it. An agent resuming a session has no reason to run `git log` before it starts working, and by the time it does it has already formed a plan around a tree that moved"

# ─────────────────────────────────────────────────────────────────────────────
# Considered and rejected.
#
# Recorded so the same candidate is not re-litigated every time someone
# rediscovers it. `omh why <name>` answers for these too.
# ─────────────────────────────────────────────────────────────────────────────

[[rejected]]
name       = "git-unavailable"
considered = "2026.08"
because    = "shipped through 2026.08 as a hook refusing every shell command containing `git`, and correct for exactly as long as git could not work: the worktree's `.git` points at an admin directory in the checkout, which omh does not mount. The sandbox now has a repository of its own, so the same hook refuses the feature instead of explaining it. Recorded here because `should omh stop the agent running git?` is the question someone rediscovers, and the answer changed rather than being wrong the first time."

[[rejected]]
name       = "gitnexus"
considered = "2026.06"
because    = "PolyForm-Noncommercial. Every omh user writing code at work would be in violation of a dependency they never chose — a distribution doing that is doing something to its users. Legitimate as an opt-in profile, never as a default."

[[rejected]]
name       = "codegraphcontext"
considered = "2026.06"
because    = "MIT, but requires a running Neo4j. A service to stand up is a decision to make, and the base set exists to remove decisions."

[[rejected]]
name       = "mcp-code-graph"
considered = "2026.06"
because    = "unmaintained for roughly a year at the time of review."

[[rejected]]
name       = "search_code"
considered = "2026.08"
because    = "looks like a cheaper grep, but `--pattern 'fn unfilled' --mode compact` returned zero results against a symbol that demonstrably exists. Routing literal search through it would make things worse, and the claim stays unverified until that is explained."

# ─────────────────────────────────────────────────────────────────────────────
# Memory
# ─────────────────────────────────────────────────────────────────────────────

[[entry]]
name    = "memory"
kind    = "mcp"
feature = "memory"
since   = "2026.08"
because = "what a session learned outlives it — a removed session leaves no transcript to grep"
remove  = "omh config mcp rm memory"
command = "omh"
args    = [
  "memory", "serve",
  # The committed layer is tracked, so it arrives inside the worktree and
  # needs no mount. The local layer is mounted from ~/.omh, keyed by repo,
  # because a worktree holds tracked files only and `omh s rm` removes it
  # with --force.
  "--team",  "/work/.omh/notes",
  "--local", "/omh/notes/local",
]

  [[entry.measured]]
  what  = "injected per session"
  value = "1512 B"
  how   = "two tool names, descriptions and schemas as the server emits them, recomputed from the shipped code by the_memory_surfaces_declared_cost_matches_what_it_ships"
  on    = "2026-08-10"

  [[entry.measured]]
  what  = "the surface it replaces"
  value = "14 tools, 3787 B"
  how   = "iwec v0.19.0 answering tools/list in a container, measured during M0 — see docs/design/memory-m0.md"
  on    = "2026-08-08"

  [[entry.instead_of]]
  name = "iwe's own MCP server (iwec)"
  why  = "cannot carry a note's layer — it is the directory, not a field — and `iwe rename` rewrites links to titles, producing notes omh's schema refuses"

  [[entry.instead_of]]
  name = "an AGENTS.md section listing what the store holds"
  why  = "a rules file decays as context grows; a tool description arrives attached to the call"

  [[entry.instead_of]]
  name = "letting the agent grep the notes directory"
  why  = "grep cannot attach a note's date and layer, and an undated claim of unknown origin cannot be judged"

[[entry]]
name    = "memory-rules"
kind    = "rules"
feature = "memory"
since   = "2026.08"
because = "*record what surprised you* is a trigger, and an agent cannot look up a rule it does not know it needs — no tool description can carry that. The note shape rides along for the case `memory::deliver` documents: a session that got no memory server writes the file by hand"
remove  = "omh config mcp rm memory"

  [[entry.measured]]
  what  = "in the agent's context, every turn"
  value = "1963 B"
  how   = "the section as shipped, byte for byte, computed by `every_rules_section_costs_what_it_says`. Larger than the other two because it carries the note template verbatim — worth re-measuring against how often `memory::deliver` actually fails, since `remember` enforces the same schema at the write whenever the server is there"
  on    = "2026-08-12"

  [[entry.instead_of]]
  name = "the tool descriptions alone"
  why  = "a description is attached to one tool and cannot say `prefer the other one`, which is exactly what the code-graph-or-recall choice needs. The 1512 B of tool surface is already counted under `memory`; this is the part that cannot live there"
