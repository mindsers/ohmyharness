[package]
name = "omh"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Launch any coding harness, in a sandbox, with your setup already there."
license = "MIT"
authors = ["Nathanaël Cherrier <nathanael@cherrier.dev>"]
repository = "https://github.com/mindsers/ohmyharness"
readme = "README.md"
keywords = ["agent", "sandbox", "claude", "mcp", "devtools"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "omh"
path = "src/main.rs"
