[package]
name = "omh"
version = "0.0.1"
edition = "2021"
description = "Launch any coding harness, in a sandbox, with your setup already there."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "omh"
path = "src/main.rs"
