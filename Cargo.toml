[package]
name = "omh"
version = "0.14.1"
edition = "2021"
rust-version = "1.85"
description = "Launch any coding harness, in a sandbox, with your setup already there."
license = "MIT"
authors = ["Nathanaël Cherrier <nathanael@cherrier.dev>"]
repository = "https://github.com/mindsers/ohmyharness"
readme = "README.md"
keywords = ["agent", "sandbox", "claude", "mcp", "devtools"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
# Styling is the vocabulary only — `Style` renders escapes and nothing else, so
# it makes no decision about whether to. That decision is `out::Palette`'s, and
# keeping it there is what lets a test resolve colour without a terminal.
# Already in the tree as clap's own dependency, so this is an edge, not code.
anstyle = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Writing settings is a read-modify-write on a file people maintain by hand,
# so the writers use the format-preserving document rather than the serializer:
# a round trip through `toml::to_string_pretty` deletes every comment in it.
# Already in the tree as `toml`'s own dependency, so this is an edge, not code.
toml_edit = "0.25"
# `Session::diff` stages the worktree into an index of its own so a review can
# see files the agent created without touching the index the user's git shares.
# A dev-dependency until that shipped, which `cargo test` hid: the test profile
# links dev-dependencies into the bin target, so the suite went green against a
# binary `cargo build` could not produce.
tempfile = "3"
# `omh settings` at a terminal is a screen rather than a report: your defaults,
# your servers and every catalogue entry, changed in place. Layout, lists and
# the terminal's own events; `crossterm` is the only backend compiled in.
# Pinned below 0.30, which needs rust 1.88 — past this crate's rust-version.
# For the same reason Cargo.lock holds its `instability` at 0.3.10, the newest
# that declares 1.85 or older: re-resolve it with
# `CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update`, not a bare
# `cargo update`, or the msrv job is the one that finds out.
# `unstable-rendered-line-info` is `Paragraph::line_count`, which counts the
# rows a paragraph wraps to with the renderer's own wrapping: a box sized by a
# count of its own disagreed at every word that filled a row.
ratatui = { version = "0.29", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

# The end-to-end suite: every harness, in its image, against a fake model.
# Behind a feature so a default build never compiles it — it needs Docker and
# the four images, and `--include-ignored` would otherwise run it on every push.
[features]
e2e = []

[[bin]]
name = "omh"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]
