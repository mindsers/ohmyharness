name = "omp"
bin  = "omp"
# A release binary, not a package manager. oh-my-pi ships one executable per
# platform; its npm package, `@oh-my-pi/pi-coding-agent`, needs Bun, which the
# harness image does not have (a repo's node stack can add it, in a later
# layer). So this is `curl` where the other adapters are `npm install -g`.
# Pinned to a tagged release and verified against a per-arch checksum before
# `chmod +x`: a release binary made executable without a checksum is the
# supply-chain gap a pin exists to close.
#
# The sums under `[checksums]` are the source of truth `omh doctor` reads; the
# install repeats the right one per arch and `sha256sum -c` refuses a download
# that does not match. Both filled from `SHA256SUMS.txt` published alongside
# this tag's release, cross-checked by downloading `omp-linux-arm64` and
# `omp-linux-x64` independently and hashing them rather than trusting the sums
# file alone — the two agreed.
version = "18.10.4"
install = """arch=$(case "$(uname -m)" in aarch64|arm64) echo arm64 ;; *) echo x64 ;; esac) && sum=$(case "$arch" in arm64) echo 58d711d56fa0c95d208c150575dfdb08fe8fc1262e3820d2d900f0a5e750110b ;; *) echo ff59fc1b484c1308a7247ad208305005627b3fac62b440737c2b1835ac32074e ;; esac) && curl -fsSL https://github.com/can1357/oh-my-pi/releases/download/v{{version}}/omp-linux-$arch -o /usr/local/bin/omp && echo "$sum  /usr/local/bin/omp" | sha256sum -c - && chmod +x /usr/local/bin/omp"""

# Per-`uname -m` SHA-256 of the release binary — `omp-linux-arm64` and
# `omp-linux-x64` from `v18.10.4`. Inline, so it stays a top-level key rather
# than swallowing the keys below it into a `[checksums]` section.
checksums = { x86_64 = "ff59fc1b484c1308a7247ad208305005627b3fac62b440737c2b1835ac32074e", aarch64 = "58d711d56fa0c95d208c150575dfdb08fe8fc1262e3820d2d900f0a5e750110b" }

# The whole directory, and it has to be: omp keeps credentials in **SQLite**
# (`auth_credentials`, `auth_credential_blocks` in `agent.db`), and a bind-
# mounted file cannot survive the rename SQLite does through its `-wal` and
# `-shm` sidecars.
#
# `~/.omp/agent` is the default profile's directory. omp resolves it through
# `getAgentDir()`, which moves to `~/.omp/profiles/<name>/agent` when an omp
# profile is active — so omh's `--profile` and omp's are two different words
# that happen to be spelled the same, and an omp profile is outside what this
# adapter carries.
creds = ["$HOME/.omp/agent/"]

# No `token`. There is no file whose existence proves an omp login: the
# credentials are rows in `agent.db`, and that database is created by boot noise
# — settings, model_perf, usage_history — on the first start. Pointing `token`
# at it would report a successful login for a session that never logged in,
# which is the exact false positive `auth::unfilled` exists to prevent, so the
# question is asked of the harness instead — see `[token-probe]` below.
login = "run `/login` inside omp, then exit"

[token-probe]
run = "omp usage --json"
# `omp usage` reports "usage limits for every authenticated account"; with no
# accounts its `reports` array is empty — verified by running it. `accountId`
# is the per-report field, read off the source rather than off a logged-in run,
# and it is the one claim here that `omh doctor` still has to settle.
ready = "accountId"

# How this harness names the things an agent does. Verified against
# `docs/tools/*.md` at v18.2.3: `bash` takes `command`, `read` takes `path`.
#
# No `search`: omp has `grep` and `glob` as separate tools and omh's vocabulary
# has one word for both, so a hook narrowing to `search` is dropped by name
# rather than silently matching half of what it asked for. The same reasoning,
# and the same omission, as the opencode adapter.
[tools]
edit  = "edit|write"
read  = "read"
shell = "bash"

# omp prefers `AGENTS.md` and reads `CLAUDE.md` only as one more flavour of the
# same file, so there is nothing to put in `also` — unlike Claude Code, where
# both names are live and the bytes are identical either way.
[capabilities.rules]
path   = "/work/AGENTS.md"
render = "concat"
# The **personal** file, never the repo's: `rules::compose` already puts this
# project's own AGENTS.md into every session, so importing that one would
# deliver the same prose twice. omp's user-scope rules file is `RULES.md` in the
# agent directory. It also reads a user-scope `AGENTS.md` beside it; that one is
# left alone because omh imports one personal rules file per harness, not
# because importing it would duplicate anything.
import = "$HOME/.omp/agent/RULES.md"

# `<agent-dir>/skills/<name>/SKILL.md`, one level deep and not recursive. From
# `packages/coding-agent/src/discovery/builtin.ts`, not from the prose: the docs
# name `.omp/skills` for a project and leave the user root to `getAgentDir()`.
[capabilities.skills]
path   = "$HOME/.omp/agent/skills"
render = "dir"
import = "$HOME/.omp/agent/skills"

# User scope. omp also reads `.omp/mcp.json` and `.omp/.mcp.json` from a
# project, and neither is where omh mounts yours — the user file is the one
# that is omh's to own, the way `$HOME/.config/opencode/opencode.json` is.
#
# The document shape is Claude Code's: `{ "mcpServers": { name: { command, … } } }`,
# with `type` defaulting to `stdio` when absent. That is why this renders with
# `mcp-json` and needs no renderer of its own.
[capabilities.mcp]
path   = "$HOME/.omp/agent/mcp.json"
render = "mcp-json"
import = "$HOME/.omp/agent/mcp.json"
# No `verify`/`ready`, and this is the one place this adapter is weaker than
# `claude`. omp has no `mcp` subcommand: its listing is `/mcp`, a slash command
# inside the TUI, and reaching it head-lessly means starting an agent session —
# so the check would spend a model call to answer a question about a file.
#
# It was tried. `omp -p '/mcp list'` went in, `omh doctor` ran it, and the
# result was worse than nothing: the command wrote output that ran into the next
# check's line and swallowed it, so the run reported on six capabilities while
# claiming seven. A check that cannot fail cleanly is not a check.
#
# What that costs is exactly what `adapters.md` says it costs — this path is a
# claim no `doctor` run can settle, the same state the `claude` adapter's `mcp`
# binding was in for a year while pointing somewhere nothing reads. It is on
# record rather than papered over.

[capabilities.commands]
path   = "$HOME/.omp/agent/commands"
render = "dir"
import = "$HOME/.omp/agent/commands"

# `~/.omp/agent/agents/*.md`, per `docs/task-agent-discovery.md`. The singular
# `agent` in the path is the config root; the plural is the directory.
[capabilities.subagents]
path   = "$HOME/.omp/agent/agents"
render = "dir"
import = "$HOME/.omp/agent/agents"

# Hooks are a **module**, not a configuration file — the second harness in a row
# to be so, which confirms what `OpencodePlugin`'s doc already suspected on one
# example: declarative hook config is the exception, not the rule.
#
# A hook module default-exports a factory that receives `pi` and registers
# handlers with `pi.on(...)`. Discovery scans `<scope>/hooks/pre/` and
# `<scope>/hooks/post/`, but pre/post is only where a file is *found*: the
# factories are loaded as extension modules and bind whatever moments they
# register, so one module under `pre/` carries all four. That last clause is a
# claim about oh-my-pi, and `omh doctor` is what settles it.
[capabilities.hooks]
path   = "$HOME/.omp/agent/hooks/pre/omh.ts"
render = "omp-plugin"

# omh's moments, in omp's words. All four exist, as they do on claude —
# opencode is the one that maps three.
#
# Mapping `session-start` is not the same as being able to *speak* there. omp's
# session and turn events are observational: their return value is ignored, so
# only a `run` survives and an `inject` at `session-start` is dropped by name.
# `graph-orient` is dropped here for that reason, where opencode drops it for
# not having the moment at all. Closing that gap needs `pi.sendMessage`, which
# is on omp's superset API and is not mapped because no run has confirmed its
# signature — an unverified template that silently does nothing is worse than a
# hook dropped out loud.
[capabilities.hooks.events]
session-start = "session_start"
turn-end      = "turn_end"
before-tool   = "tool_call"
after-tool    = "tool_result"

# Where this harness keeps each field. Property names on `event.input` — the
# call's arguments — read in the renderer's own language the way opencode's
# are, not jq paths. Naming `event` itself would send the next person adding a
# field to `event.toolName`, which the renderer would emit as
# `event.input?.toolName` and bind to the empty string.
#
# `tool-file` is `path`: `read`'s and `write`'s parameter, and `edit`'s too in
# its replace and patch modes. Hashline, the default, carries the path inside
# `input` instead, which the `fields-by-tool.edit` entry below reads first.
[capabilities.hooks.fields]
tool-file    = "path"
tool-command = "command"

# `edit`'s own copy of `tool-file` — the escape hatch `[fields]` cannot
# express, since it has one entry per canonical field, not one per (field,
# tool) pair. `edit`'s own parameter is *also* named `input` — confusingly,
# since `event.input` already means "this call's arguments" in every other
# entry here — so the string is `event.input.input`, not `event.input`
# itself; the first version of this line read `event.input` directly and
# threw `event.input?.match is not a function` the first time it actually
# ran. That string contains one or more `[PATH#TAG]` sections rather than a
# plain path at all: confirmed against `docs/tools/edit.md` at v18.2.3 and
# again at v18.10.4 — "One or more `[PATH#TAG]` sections containing
# hashline operations", TAG being "four-uppercase-hex". This reads the first
# section's PATH the way omp's parser does (`parse_header` in
# `crates/pi-edit/src/modes/hashline/tokenizer.rs` at v18.10.4): up to the
# *last* `#`, since v18.4.1 lets a file name hold one ("Fixed hashline edits
# rejecting files whose names contain `#` (such as yadm alternate files)");
# with balanced brackets, as in `app/[slug]/page.tsx`; and with a tag in
# either case, which omp upper-cases.
#
# The known gap: a single `edit` call can batch sections across *several*
# files (the same doc: "Same-path sections are merged"; a call can also
# touch unrelated paths). `$OMH_TOOL_FILE` is one value, so a guard sees only
# the first file a batched edit touches — discipline, not full coverage, the
# same posture every guard already takes toward a bypass it cannot close.
[capabilities.hooks.fields-by-tool.edit]
tool-file = '(event.input?.input?.match(/\[((?:[^[\]]|\[[^[\]]*\])*)#[0-9A-Fa-f]{4}\]/) ?? [])[1] ?? event.input?.path'

# Advisory text, at the one moment there is a channel for it: a `tool_result`
# handler returning `content` replaces what the model reads next, so appending
# to it reaches the model. The renderer is what restricts this to `after-tool`.
# Since v18.3.1 a `tool_call` handler can also return `additionalContext`
# ("Added passive tool-call context support"); omh does not use it yet, and
# until it does, a nudge before a call is dropped by name rather than turned
# into a wall.
[capabilities.hooks.inject]
template = 'return { content: [...(event.content ?? []), { type: "text", text: {{text}} }] }'

# Blocking, with a reason the model is shown. `{ block: true, reason }` from a
# `tool_call` handler: the wrapper stops the call and `reason` becomes the
# thrown error text. A decision said out loud, the way `permissionDecision` is
# on Claude Code, rather than a throw the shell has to interpret.
[capabilities.hooks.refuse]
template = 'return { block: true, reason: {{text}} }'

# The account's model providers, kept in `provider.yml` at the account root,
# which no mount reaches, and rendered over `models.yml` read-only — `{}` when
# there are none (#197 §0, §6). In the account, `models.yml` is a file every
# session can rewrite, and omp trusts it at the next start: a provider's
# `baseUrl` sends the credentials it carries wherever the file says, and an
# `apiKey` or a header value starting with `!` runs through `/bin/sh`
# (`config/resolve-config-value.ts`). With `models.yml` there, omp reads
# neither `models.yaml` nor `models.json` (`config/config-file.ts`). It writes
# `models.yml` only to migrate a `models.json` into it, when `models.yml` is
# absent — which, mounted, it never is.
#
# `drop`: omp's model cache, `models.db` in SQLite with its `-wal` and `-shm`
# (opened in WAL mode, `catalog/src/model-cache.ts`), is in the account too, and
# a fresh cached model keeps its own `baseUrl` —
# "a matching cache may contain provider-endpoint overrides"
# (`config/model-registry.ts`). omp rebuilds it at its next start, so omh
# removes it from the account before each launch.
[provider]
format = "omp-models"
path   = "$HOME/.omp/agent/models.yml"
import = "$HOME/.omp/agent/models.yml"
drop   = [
  "$HOME/.omp/agent/models.db",
  "$HOME/.omp/agent/models.db-wal",
  "$HOME/.omp/agent/models.db-shm",
]

# The keys of omp's settings that are your preferences, kept per account and
# copied into each session; nothing else a session writes in `config.yml`
# reaches another (#197 §1, §3). Each is a setting omp 18.10.4 registers
# (`config/model-settings.ts`, `session/settings.ts`, `modes/settings.ts`):
# which model each role uses and the order `/model` cycles them, the models
# offered, the presets `/modelpreset` saves — each a role's model and a
# thinking level, nothing else — the default thinking level, the dark and
# light themes by name, and the three display choices its setup wizard asks
# for (`modes/setup.ts`): colour-blind mode, the symbol preset and the
# composer's shape. None names a program, grants a consent or a trust,
# carries text before the model or picks where traffic goes:
#
# - a model id, `@upstream` route or role (`web`, `image`, `speech`) resolves
#   only against providers the account's provider file (`[provider]`) or its
#   login already configured — it chooses among them, never adds one;
# - a theme name that is not built in loads `themes/<name>.json` from the
#   agent directory, whose schema holds colours and symbols alone
#   (`additionalProperties: false`), as Claude's `custom:` theme does.
#
# `quiet`: `setupVersion`, which omp writes once its setup wizard has run
# (`modes/setup.ts`) and below which every interactive start runs the wizard
# again (`main.ts`) — a session's copy without it would start with the wizard.
#
# `link`: omp saves `config.yml` by writing beside it and renaming over it,
# which a single-file mount refuses, and resolves a link before it does
# (`#resolveYamlWritePath`: `realpath`, or the chain hop by hop where it
# dangles) — so the account's file becomes a link to the session's own copy
# [measured in #197 through `omp config set`, the writer its pickers share; the
# e2e saves through it].
#
# `fallback`: omp reads `config.yaml` where `config.yml` is absent
# (`MAIN_CONFIG_FILENAMES`), so an account's preferences can be there before
# the link — migrated from it, and it goes. Once the link is laid, omp never
# reads `config.yaml` again.
[preferences]
mount = "link"

[preferences.files]
"$HOME/.omp/agent/config.yml" = [
  "modelRoles",
  "defaultThinkingLevel",
  "theme.dark",
  "theme.light",
  "enabledModels",
  "cycleOrder",
  "modelPresets",
  "colorBlindMode",
  "symbolPreset",
  "composer.shape",
]

[preferences.quiet]
"$HOME/.omp/agent/config.yml" = ["setupVersion"]

[preferences.fallback]
"$HOME/.omp/agent/config.yml" = ["$HOME/.omp/agent/config.yaml"]
