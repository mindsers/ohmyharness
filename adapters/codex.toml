name = "codex"
bin  = "codex"

# Pinned like the other npm harnesses (see claude.toml). MAINTAINER: bump
# `version` to the release under test — a wrong pin is caught by omh's own build
# and `omh doctor`, not by `cargo test`.
version = "0.154.0"
install = "npm install -g @openai/codex@{{version}}"

# The whole config directory, not the token file: a bind-mounted *file* cannot
# be replaced by rename, and a tool saves its token by writing a temp file and
# renaming over it. Codex keeps everything under `~/.codex`.
creds = ["$HOME/.codex/"]

# Where Codex writes its rollouts — one JSONL per session, under dated
# directories (`sessions/YYYY/MM/DD/rollout-<time>-<id>.jsonl`, measured in
# 0.154.0). omh mounts a per-session directory over it so `omh sNN` can read
# what the agent did and what it cost; `transcript::read_codex_record` reads it.
transcripts = "$HOME/.codex/sessions"

# What proves a login: `auth.json` holds the API key or the OAuth tokens Codex
# writes after `codex login` — with Codex's default credential store, `file`.
# Set to `keyring` (or `auto`, where a keyring exists) it writes no file, so
# `omh auth codex --import` finds nothing on that host and says so; inside the
# sandbox there is no keyring, and the default holds. A config directory fills with other files on the
# first start, so nothing else there distinguishes a login from boot noise.
token = ["$HOME/.codex/auth.json"]

# Device code, not the default browser sign-in: that one waits for a redirect
# on `127.0.0.1:1455` inside the sandbox, where the host's browser never
# arrives. Codex's own sign-in screen offers both. A login that already exists
# on this machine can be copied instead, with `omh auth codex --import`.
login = "choose `Sign in with Device Code` in Codex, then exit — or run `omh auth codex --import` to copy this machine's login"

# How this harness names the things an agent does, as its hooks see them —
# measured in the 0.154.0 image with a stub model making real calls. The shell
# tool is `exec_command` to the model and `Bash` to a hook; an edit is
# `apply_patch`, which `Edit` and `Write` also match as aliases. A matcher of
# plain names must equal one exactly (`Ba` does not match `Bash`).
#
# No `read`: Codex reads files through the shell. No `search`, for the same
# reason. Hooks narrowing to either are dropped by name.
#
# **A known gap:** an `apply_patch` the model runs *through the shell*
# (`apply_patch <<'EOF'`) reaches hooks as `Bash`, with the patch inside
# `command` — an `edit` guard does not see it, and no `after-tool` fires for it.
[tools]
edit  = "apply_patch"
shell = "Bash"

# No `commands`: no loader for a `~/.codex/prompts` directory turns up in
# Codex 0.154.0's source, and its slash commands migrate to skills
# (`core-plugins/src/command_migration.rs`). No `subagents`
# binding either: Codex's roles are `[agents.<role>]` config, not files omh
# stages.
#
# Codex reads `AGENTS.md`, the standard file, and nothing Claude-specific — so
# there is no `also`, unlike the claude adapter where both names are live.
[capabilities.rules]
path   = "/work/AGENTS.md"
render = "concat"
# The **personal** file, never the repo's: `rules::compose` already composes
# this project's own AGENTS.md into every session, so importing that one would
# deliver the same prose twice. Codex's user-scope instructions live in
# `~/.codex/AGENTS.md`. When `~/.codex/AGENTS.override.md` exists Codex reads
# it *instead* (measured: only the override reached the prompt), and omh does
# not import it — a host with one gets its `AGENTS.md` in the sandbox, which
# is not what that host's Codex reads.
import = "$HOME/.codex/AGENTS.md"

# `~/.agents/skills`, not `~/.codex/skills`. Codex still reads the latter — "deprecated
# user skills location", `ext/skills/src/host_roots.rs` at `rust-v0.154.0` — but installs its own system skills into
# `~/.codex/skills/.system` — and omh's read-only mount over the directory hid
# them without a word. Measured in the 0.154.0 image with
# `codex debug prompt-input`: mounted there, a staged skill loaded and
# `imagegen` was gone; mounted here, both loaded.
#
# Imported from the old location, which is where a Codex that predates the
# move kept yours. Skills already in `~/.agents/skills` on the host are not
# imported — that directory is not Codex's alone; opencode reads it too.
[capabilities.skills]
path   = "$HOME/.agents/skills"
render = "dir"
import = "$HOME/.codex/skills"

# User scope, TOML. Codex's config is `~/.codex/config.toml`, and its MCP
# servers live under `[mcp_servers.<name>]` tables — which is why this renders
# with `codex-toml` rather than the `mcp-json` the other harnesses use.
#
# `codex mcp list` answers without a login (`omh doctor` runs it with no
# account) and prints a `Status` column. Its `enabled` comes from the parsed
# config — `format_mcp_status` in `codex-rs/cli/src/mcp_cmd.rs` at
# `rust-v0.154.0` — and a server pointing at a command that does not exist is
# `enabled` too, so this
# proves Codex *read* the file omh mounted, not that the server runs. Weaker
# than Claude's `Connected`, and still the question `omh doctor` could not ask
# before: whether the file is anything Codex opens.
[capabilities.mcp]
path   = "$HOME/.codex/config.toml"
render = "codex-toml"
import = "$HOME/.codex/config.toml"
verify = "codex mcp list"
ready  = "enabled"

# omh's hooks go in the **system** layer, which Codex runs as managed. From the
# user layer (`~/.codex/config.toml`) a hook runs only once Codex has recorded
# a `trusted_hash` for it; measured, the same hook fired from `/etc/codex` and
# not from `~/.codex`. Yours stay in `~/.codex`, under Codex's own trust.
[capabilities.hooks]
path   = "/etc/codex/config.toml"
render = "codex-hooks"
import = "$HOME/.codex/config.toml"

# Claude Code's names, measured firing in `codex exec`.
[capabilities.hooks.events]
session-start = "SessionStart"
turn-end      = "Stop"
before-tool   = "PreToolUse"
after-tool    = "PostToolUse"

# `tool_input` is `{"command": …}` for both tools: the shell command for
# `Bash`, the whole patch text for `apply_patch`. There is no file path field.
[capabilities.hooks.fields]
tool-command = ".tool_input.command"

# `edit`'s file, read out of the patch: its first `*** Update File:`,
# `*** Add File:` or `*** Delete File:` header. The same posture as omp's
# `[PATH#TAG]` override — a patch touching several files shows a guard only
# the first.
[capabilities.hooks.fields-by-tool.edit]
tool-file = '.tool_input.command | (capture("\\*\\*\\* (Update|Add|Delete) File: (?<p>[^\\n]+)") | .p)'

# Measured reaching the model as a developer message at `SessionStart`,
# `PreToolUse` and `PostToolUse`. **Not at `Stop`**, which rejects the key as
# invalid output — the renderer drops an injection there by name.
[capabilities.hooks.inject]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","additionalContext":$m}}'"""

# Measured blocking both tools, even with approvals bypassed; the model reads
# "Command blocked by PreToolUse hook: <reason>".
[capabilities.hooks.refuse]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","permissionDecision":"deny","permissionDecisionReason":$m}}'"""
