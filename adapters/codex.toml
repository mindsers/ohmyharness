name = "codex"
bin  = "codex"

# Pinned like the other npm harnesses (see claude.toml). MAINTAINER: bump
# `version` to the release under test — a wrong pin is caught by omh's own build
# and `omh doctor`, not by `cargo test`.
version = "0.162.1"
install = "npm install -g @openai/codex@{{version}}"

# The whole config directory, not the token file: a bind-mounted *file* cannot
# be replaced by rename, and a tool saves its token by writing a temp file and
# renaming over it. Codex keeps everything under `~/.codex`.
creds = ["$HOME/.codex/"]

# Where Codex writes its rollouts — one JSONL per session, under dated
# directories (`sessions/YYYY/MM/DD/rollout-<time>-<id>.jsonl`, measured in
# 0.154.0). omh mounts a per-session directory over it so `omh sNN` can read
# what the agent did and what it cost; `transcript::read_codex_record` reads it.
transcripts = "$HOME/.codex/sessions"

# What proves a login: `auth.json` holds the API key or the OAuth tokens Codex
# writes after `codex login` — with Codex's default credential store, `file`.
# Set to `keyring` (or `auto`, where a keyring exists) it writes no file, so
# `omh auth codex --import` finds nothing on that host and says so; inside the
# sandbox there is no keyring, and the default holds. A config directory fills with other files on the
# first start, so nothing else there distinguishes a login from boot noise.
token = ["$HOME/.codex/auth.json"]

# Device code, not the default browser sign-in: that one waits for a redirect
# on `127.0.0.1:1455` inside the sandbox, where the host's browser never
# arrives. Codex's own sign-in screen offers both. A login that already exists
# on this machine can be copied instead, with `omh auth codex --import`.
login = "choose `Sign in with Device Code` in Codex, then exit — or run `omh auth codex --import` to copy this machine's login"

# How this harness names the things an agent does, as its hooks see them —
# measured in the 0.154.0 image with a stub model making real calls. The shell
# tool is `exec_command` to the model and `Bash` to a hook; an edit is
# `apply_patch`, which `Edit` and `Write` also match as aliases. A matcher of
# plain names must equal one exactly (`Ba` does not match `Bash`).
#
# No `read`: Codex reads files through the shell. No `search`, for the same
# reason. Hooks narrowing to either are dropped by name.
#
# **A known gap:** an `apply_patch` the model runs *through the shell*
# (`apply_patch <<'EOF'`) reaches hooks as `Bash`, with the patch inside
# `command` — an `edit` guard does not see it, and no `after-tool` fires for it.
[tools]
edit  = "apply_patch"
shell = "Bash"

# No `commands`: no loader for a `~/.codex/prompts` directory turns up in
# Codex 0.154.0's source, and its slash commands migrate to skills
# (`core-plugins/src/command_migration.rs`). No `subagents`
# binding either: Codex's roles are `[agents.<role>]` config, not files omh
# stages.
#
# Codex reads `AGENTS.md`, the standard file, and nothing Claude-specific — so
# there is no `also`, unlike the claude adapter where both names are live.
[capabilities.rules]
path   = "/work/AGENTS.md"
render = "concat"
# The **personal** file, never the repo's: `rules::compose` already composes
# this project's own AGENTS.md into every session, so importing that one would
# deliver the same prose twice. Codex's user-scope instructions live in
# `~/.codex/AGENTS.md`. When `~/.codex/AGENTS.override.md` exists Codex reads
# it *instead* (measured: only the override reached the prompt), and omh does
# not import it — a host with one gets its `AGENTS.md` in the sandbox, which
# is not what that host's Codex reads.
import = "$HOME/.codex/AGENTS.md"

# `~/.agents/skills`, not `~/.codex/skills`. Codex still reads the latter — "deprecated
# user skills location", `ext/skills/src/host_roots.rs` at `rust-v0.154.0` — but installs its own system skills into
# `~/.codex/skills/.system` — and omh's read-only mount over the directory hid
# them without a word. Measured in the 0.154.0 image with
# `codex debug prompt-input`: mounted there, a staged skill loaded and
# `imagegen` was gone; mounted here, both loaded.
#
# Imported from the old location, which is where a Codex that predates the
# move kept yours. Skills already in `~/.agents/skills` on the host are not
# imported — that directory is not Codex's alone; opencode reads it too.
[capabilities.skills]
path   = "$HOME/.agents/skills"
render = "dir"
import = "$HOME/.codex/skills"

# TOML, under `[mcp_servers.<name>]` tables — which is why this renders with
# `codex-toml` rather than the `mcp-json` the other harnesses use.
#
# In `/etc/codex/managed_config.toml`, not `~/.codex/config.toml` where yours
# are. Codex rewrites `~/.codex/config.toml` itself — a directory's trust, a
# notice it was told to hide, the model picked — by writing a temporary file
# and renaming it over, and a file omh mounted there refuses the rename: the
# interactive app failed to start with "failed to persist config.toml". That
# file now lives in the account's `~/.codex`, writable. Codex loads servers
# from the managed file too — measured, `codex mcp list` names them.
#
# omh's own servers — the base set's, never yours — carry
# `default_tools_approval_mode = "approve"`. Without it Codex asked before
# every call: a real session stopped its first `search_graph` at "Allow the
# codegraph MCP server to run tool …?".
#
# `codex mcp list` answers without a login (`omh doctor` runs it with no
# account) and prints a `Status` column. Its `enabled` comes from the parsed
# config — `format_mcp_status` in `codex-rs/cli/src/mcp_cmd.rs` at
# `rust-v0.154.0` — and a server pointing at a command that does not exist is
# `enabled` too, so this
# proves Codex *read* the file omh mounted, not that the server runs. Weaker
# than Claude's `Connected`, and still the question `omh doctor` could not ask
# before: whether the file is anything Codex opens.
[capabilities.mcp]
path   = "/etc/codex/managed_config.toml"
render = "codex-toml"
import = "$HOME/.codex/config.toml"
verify = "codex mcp list"
ready  = "enabled"

# omh's hooks go in the **system** layer, which Codex runs as managed. From the
# user layer (`~/.codex/config.toml`) a hook runs only once Codex has recorded
# a `trusted_hash` for it; measured, the same hook fired from `/etc/codex` and
# not from `~/.codex`. Yours in `~/.codex` and a repo's in `.codex/` no longer
# run at all [src, see `[policy]` below]: managed hooks only, and omh's are
# those.
#
# The same file trusts `/work`, and turns Codex's own sandbox off, on every
# launch whatever hooks there are. Codex sandboxes commands with bubblewrap,
# which cannot create a namespace under omh's capabilities: every shell command
# and every `apply_patch` failed until `sandbox_mode = "danger-full-access"`.
# omh's container is the sandbox.
# Without it the interactive app asks — and cannot save the answer — and an
# untrusted `/work` was measured skipping `AGENTS.md` and asking before every
# command.
#
# And it turns off the daemon Codex 0.157.0 started by default. Measured in the
# 0.162.1 image, 25 seconds of the interactive app copied 390 MB of Codex into
# `~/.codex/packages` — the account's directory, on the host — and ran two
# `app-server` processes out of it. That copy follows the latest release, not
# this pin. With `daemon_auto_start = false` here, neither happened.
#
# This is Codex's lowest layer (`config/src/loader/README.md`), so like every
# key in it, a `daemon_auto_start` you set in `~/.codex/config.toml`, or a repo
# sets in its `.codex/config.toml`, wins.
[capabilities.hooks]
path   = "/etc/codex/config.toml"
render = "codex-hooks"
import = "$HOME/.codex/config.toml"

# Claude Code's names, measured firing in `codex exec`.
[capabilities.hooks.events]
session-start = "SessionStart"
turn-end      = "Stop"
before-tool   = "PreToolUse"
after-tool    = "PostToolUse"

# `tool_input` is `{"command": …}` for both tools: the shell command for
# `Bash`, the whole patch text for `apply_patch`. There is no file path field.
[capabilities.hooks.fields]
tool-command = ".tool_input.command"

# `edit`'s file, read out of the patch: where a `*** Move to:` sends it, which
# is the file written, else its first `*** Update File:`, `*** Add File:` or
# `*** Delete File:` header. The same posture as omp's `[PATH#TAG]` override —
# a patch touching several files shows a guard only the first.
[capabilities.hooks.fields-by-tool.edit]
tool-file = '.tool_input.command | ((capture("\\*\\*\\* Move to: (?<p>[^\\n]+)") | .p) // (capture("\\*\\*\\* (Update|Add|Delete) File: (?<p>[^\\n]+)") | .p))'

# Measured reaching the model as a developer message at `SessionStart`,
# `PreToolUse` and `PostToolUse`. **Not at `Stop`**, which rejects the key as
# invalid output — the renderer drops an injection there by name.
[capabilities.hooks.inject]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","additionalContext":$m}}'"""

# Measured blocking both tools, even with approvals bypassed; the model reads
# "Command blocked by PreToolUse hook: <reason>".
[capabilities.hooks.refuse]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","permissionDecision":"deny","permissionDecisionReason":$m}}'"""

# What a session may load, decided by the launch and not by the session.
#
# Claims below are labelled: [measured] in the 0.162.1 image, [src] read in
# Codex's source at `rust-v0.162.1` (and #197), [e2e] held by `tests/e2e`.
#
# `requirements.toml` sits above every config layer, `-c` included [src], and
# holds an `[mcp_servers]` allowlist: a server not on it, or on it with other
# arguments or one argument more, loads disabled — `codex mcp list --json`
# gives it `"disabled_reason": "requirements (/etc/codex/requirements.toml)"`
# [measured]; the executable is compared the same way [src]. It is the list
# the launch staged, by name and exact command and arguments, so a server a
# session adds with `codex mcp add` loads disabled in that session [e2e], and
# in every later one, since every launch writes this file afresh from what it
# stages. Always written, even empty: with no table Codex filters nothing
# [src]. The identity compares neither `env` nor `cwd` [src]: an entry with
# omh's command and arguments and its own `env` passes (risk 1b, #197 §0).
#
# `allow_managed_hooks_only` stops user- and project-layer hooks [src]; nothing
# in `tests/e2e` plants one. omh's own run from `/etc/codex/config.toml`, the
# system layer, which counts as managed: #197 measured `SessionStart` and
# `UserPromptSubmit` firing with the lock on, and `every_event` passes with it
# [e2e]. `chatgpt_base_url` is pinned, since it is where Codex sends the
# ChatGPT tokens [src]. The `omh-none` plugin entry holds every plugin's servers
# to a list of their own, empty for any plugin not named
# (`filter_plugin_mcp_servers_by_requirements` in
# `codex-rs/core/src/config/mod.rs`) [src] — the e2e driver turns plugins off,
# so nothing runs it. Never a `[hooks]` table: a requirements `managed_dir`
# that differs from another layer's is a composition error, and Codex refuses
# to start [src].
#
# An enterprise account caches its cloud bundle in `~/.codex`, writable, signed
# with a key in Codex's public source [src]: a session could forge one that
# loosens every later session. Masked read-only, Codex warns it cannot write
# the cache and fetches the bundle at every start [src]; an enterprise account
# offline does not start at all [src, inferred — no enterprise account was run].
# The empty mask does not stop a non-enterprise start: every codex e2e scenario
# runs with it mounted [e2e], as #197 measured with a garbage one.
[policy]
path   = "/etc/codex/requirements.toml"
format = "codex-requirements"
mask   = ["$HOME/.codex/cloud-config-bundle-cache.json"]

# The account's model provider — `model_provider` and `[model_providers.*]` —
# kept in `provider.toml` at the account root, which no mount reaches, and
# rendered into the System layer, `/etc/codex/config.toml`, beside omh's hooks
# (#197 §6). `--import` takes it from the host's own config.
[provider]
format = "codex-config"
import = "$HOME/.codex/config.toml"

# The keys of `~/.codex/config.toml` that are yours — a model, a theme — kept
# per account and copied into each session (omh's `prefs`). Everything else a
# session writes there — a server, `developer_instructions`, a provider, a
# trust — lasts that session. Read in Codex's source at the version above
# (`config/src/types.rs`, `ConfigToml`); the two tables declared whole,
# `tui.keymap` and `notice.model_migrations`, hold key bindings and model
# slugs, nothing that runs.
#
# `link`: the account's `config.toml` is a link to `/omh/prefs/config.toml`,
# which each container mounts from its session's own copy. Codex saves by
# writing beside the file and renaming over it, which a mounted file refuses
# ("failed to persist config.toml"); it resolves the link first and renames
# inside the mounted directory.
[preferences]
mount = "link"

[preferences.files]
"$HOME/.codex/config.toml" = [
  "model",
  "model_reasoning_effort",
  "plan_mode_reasoning_effort",
  "service_tier",
  "tui.theme",
  "tui.keymap",
  "tui.status_line",
  "tui.status_line_use_colors",
  "tui.terminal_title",
  "tui.session_picker_view",
  "tui.fullscreen_transcript",
  "tui.agents_overview_grouping",
  "tui.pet",
]

# Notices Codex records once a prompt is dismissed, and its model-availability
# bookkeeping. Not `notice.hide_full_access_warning`, which acknowledges a
# consent and omh renders itself. Which of these Codex writes on a first start
# on its own is not measured.
[preferences.quiet]
"$HOME/.codex/config.toml" = [
  "tui.model_availability_nux",
  "notice.fast_default_opt_out",
  "notice.hide_rate_limit_model_nudge",
  "notice.hide_gpt5_1_migration_prompt",
  'notice."hide_gpt-5.1-codex-max_migration_prompt"',
  "notice.model_migrations",
]
