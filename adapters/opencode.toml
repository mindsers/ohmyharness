name    = "opencode"
bin     = "opencode"
install = "npm install -g opencode-ai"

rules  = { path = "/work/AGENTS.md" }
skills = { path = "$HOME/.config/opencode/skills" }
mcp    = { path = "$HOME/.config/opencode/opencode.json", format = "opencode-json" }
creds  = ["$HOME/.local/share/opencode/auth.json"]
