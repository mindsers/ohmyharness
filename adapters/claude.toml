name    = "claude"
bin     = "claude"
# Pinned so a rebuild reproduces the harness it was built against, and a bump
# moves the image tag. Maintainer bumps `version` to the release under test;
# omh's own build (which needs a container runtime) and `omh doctor` are where
# a wrong pin is caught, not `cargo test`.
version = "2.1.300"
install = "npm install -g @anthropic-ai/claude-code@{{version}}"
# The whole config directory, not the token file: a bind-mounted *file* cannot
# be replaced by rename, and every tool saves its token by writing a temp file
# and renaming over it. omh prepares mountpoints for the capabilities that live
# inside this directory.
creds   = ["$HOME/.claude/", "$HOME/.claude.json"]

# Where Claude Code writes its per-project .jsonl transcripts. omh mounts a
# per-session directory over it so `omh sNN` can read what the agent did and
# what it cost.
transcripts = "$HOME/.claude/projects"

# A capability this harness cannot express is simply an absent key.
# What proves a login: a harness fills its config dir just by starting.
token   = ["$HOME/.claude/.credentials.json"]

login   = "run `/login` inside Claude Code, then exit"

# How this harness names the things an agent does. Adapter-level rather than
# per-capability: hooks match on these, the Agent Skills standard carries them
# in `allowed-tools`, and subagent frontmatter carries them in `tools`. One
# vocabulary, spelled once.
#
# No `search`. The native builds, which npm now installs, replaced `Grep` and
# `Glob` with an embedded `ugrep` and `bfs` reached through `Bash`, so
# `Grep|Glob` matched nothing and a hook narrowing to `search` shipped and never
# fired. Absent, it is dropped by name — as on omp and opencode.
#
# `MultiEdit` is no longer a tool either. It stays in the spelling because
# `omh import hooks` reads matchers back through it, and a matcher someone wrote
# against an older release still names it.
[tools]
edit   = "Edit|Write|MultiEdit"
read   = "Read"
shell  = "Bash"

[capabilities.rules]
path   = "/work/CLAUDE.md"
also   = ["/work/AGENTS.md"]  # CLAUDE.md wins where both exist; same bytes either way
render = "concat"
# The **personal** memory file, never the repo's. `rules::compose` already puts
# this project's own CLAUDE.md into every session, so importing that one would
# deliver the same prose twice — once as yours, once as the project's.
import = "$HOME/.claude/CLAUDE.md"

[capabilities.skills]
path   = "$HOME/.claude/skills"
render = "dir"
# Textually the same as `path` and not derived from it: `path` is where the
# *container* reads, `import` where the host keeps yours. The two expand
# differently, and deriving one from the other is wrong for MCP.
import = "$HOME/.claude/skills"

# Project-scoped, because that is the only file of this shape Claude Code reads.
# `$HOME/.mcp.json` was the binding here until `verify` below was able to ask:
# omh rendered it correctly and mounted it faithfully, and the harness never
# opened it — user scope for this harness lives *inside* `~/.claude.json`, nested
# per project, and a bare `~/.mcp.json` is read by nothing.
#
# Mounted over the worktree rather than written into it, the way `rules` is, so
# git has nothing to report. That does mean the mount hides a project's own
# `.mcp.json`: `omh settings mcp import` is how those servers come along,
# deliberately a
# command someone runs rather than a merge that happens quietly.
[capabilities.mcp]
path   = "/work/.mcp.json"
render = "mcp-json"
import = "$REPO/.mcp.json"   # the same path on the host, read before the mount hides it
verify = "claude mcp list"
ready  = "Connected"

[capabilities.commands]
path   = "$HOME/.claude/commands"
render = "dir"
import = "$HOME/.claude/commands"

[capabilities.subagents]
path   = "$HOME/.claude/agents"
render = "dir"
import = "$HOME/.claude/agents"

# This file also carries `permissions.allow` for omh's own MCP servers —
# `mcp__<server>`, the rule Claude Code's own binary spells beside
# `mcp__<server>__<tool>`. Claude asks before every MCP tool call in its
# default mode, and omh's rules send the agent to the graph first, so the first
# query of a session would wait on a dialog. Yours are not listed: omh ships
# and runs its own and cannot vouch for a server it did not.
#
# Handed to every `claude` in the sandbox by `--settings` [measured, 2.1.300],
# which sits above user, project and local settings and below managed ones,
# and which Claude never writes [docs]. The image puts a wrapper where
# `claude` was on `PATH` (`image::wrapper`), so omh's launches, a `claude` run
# by hand in the editor's terminal and a nested `claude -p` all get it: the
# flag goes ahead of any subcommand — `claude mcp list --settings <f>` is an
# unknown option [measured] — and a `--settings` the caller passes is merged
# into omh's, omh's keys winning, since of two Claude keeps the last whole
# [measured]. Calling the real binary by its absolute path skips the wrapper:
# that session's own business, like every other file it can write.
#
# Not `~/.claude/settings.json`, where this lived: that file is in the
# account every session on it shares, and it is masked below.
[capabilities.hooks]
path   = "/etc/omh/claude/settings.json"
render = "claude-settings"
flag   = "--settings"
eject  = "$HOME/.claude/settings.json"   # where a claude run without omh reads it
import = "$HOME/.claude/settings.json"   # host-side, where `omh import hooks` reads

# How this harness spells each word of omh's hook vocabulary. A hook is authored
# once, in omh's words; everything below is where that stops being portable.
# An absent entry means this harness has no such moment — the hooks wanting it
# are dropped by name, and the rest still ship.

[capabilities.hooks.events]
session-start = "SessionStart"   # re-fires on resume and compact, not once
turn-end      = "Stop"
before-tool   = "PreToolUse"
after-tool    = "PostToolUse"

# Where each canonical field lives in this harness's stdin schema.
[capabilities.hooks.fields]
tool-file    = ".tool_input.file_path"
tool-command = ".tool_input.command"

# `hookSpecificOutput.additionalContext` is the documented channel a hook uses
# to reach the model. Bare stdout on exit 0 is not, and the first version of the
# grep nudge wrote there — it may never have been seen.
#
# Advisory: the tool call goes ahead. That is the whole difference from `refuse`
# below, and it is invisible in the text — which is why the *format* carries it.
[capabilities.hooks.inject]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","additionalContext":$m}}'"""

# Blocking, with a reason the model is shown. A different protocol from the one
# above rather than a flag on it, per https://code.claude.com/docs/en/hooks read
# 2026-08-13: `additionalContext` advises, `permissionDecision` decides.
#
# `deny` rather than exit 2. Both block, and the docs say exit 2 wins over any
# JSON — but exit 2 makes the *shell* the protocol, so a hook body that happened
# to exit 2 for its own reasons would block a call it never meant to. A decision
# said out loud is a decision omh can render and `omh why` can explain.
[capabilities.hooks.refuse]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","permissionDecision":"deny","permissionDecisionReason":$m}}'"""

# What a session may load, decided by the launch and not by the session.
#
# Claims below are labelled: [measured] in the 2.1.300 image, [e2e] held by
# `tests/e2e`, [bin] read in the 2.1.300 binary, [docs] code.claude.com.
#
# A drop-in under `managed-settings.d`, which 2.1.300 reads [measured]: managed
# settings take precedence over user and project settings [docs], and this
# file is a read-only mount no session can change or leave behind.
# `allowManagedMcpServersOnly` with an `allowedMcpServers` list of the servers
# the launch staged, each a `serverCommand` — the command and its arguments,
# compared exactly, with no name: `["/bin/true", "a", "b"]` admitted its
# server, while the same command with other arguments and another command were
# left out of `claude mcp list` [measured]. `env` is not compared, so an entry
# with omh's command and arguments and an `env` of its own passes [measured in
# #197] — closed by the session's own copy, below. Under the lock `claude mcp add` refused an unlisted server
# ("not allowed by enterprise policy") [measured, by hand, one scope]; a
# server a session writes into `~/.claude.json` itself is left out, and so is
# one with omh's own command and one more argument [e2e].
#
# `disableClaudeAiConnectors`: a connector is matched by its URL, never by
# name [bin], and allowlisting that URL would let a session put its own server
# there. So claude.ai connectors are switched off in a session [bin, not
# measured — no account with connectors was run] — a policy, not a side
# effect. `allowManagedMcpServersOnly` and `disableClaudeAiConnectors` are
# read from every admin source, so they hold beside an organisation's own
# managed settings; `allowedMcpServers` does not merge — an organisation's list
# replaces omh's [docs, not measured].
#
# `~/.claude.json` is each session's own copy, not the account's. The lock
# compares no `env`, so an entry there with omh's command and arguments and an
# `env.PATH` of its own passes it [measured in #197] — and a shared file cannot
# be scrubbed while another session runs, since a running Claude rewrites it
# whole [not measured]. So each session gets a copy seeded from the
# account's without what names, switches or grants a server or a permission
# (`render::scrub`): identity — `oauthAccount`, `userID`, onboarding — still
# comes from the account, tokens stay in the shared `.credentials.json`, and
# nothing a session writes there reaches the account or any other session
# [e2e] — but the preferences declared below, through the review. `omh auth`
# mounts the account's own file — a login is where its identity is written —
# after `auth::scrub_account` cleans it the same way.
[policy]
path   = "/etc/claude-code/managed-settings.d/omh.json"
format = "claude-managed"
copy   = ["$HOME/.claude.json"]
# 2.1.300 reads `~/.claude/.config.json` *instead of* `~/.claude.json` when it
# is a non-empty regular file (read in the binary, `W_()`) — and it sits in the
# account's shared, writable `~/.claude/`. Measured in `tests/e2e`: a server
# planted there loaded in a session despite its own copy. Masked behind an
# empty file, Claude falls through to the copy.
mask   = ["$HOME/.claude/.config.json"]

# A preference set in a session — `/model`, `/config` — lasts into the next
# one on the account, and nothing else the session wrote does (`prefs`).
#
# `~/.claude/settings.json` is user settings, in the account's shared
# `~/.claude/`: a hook one session wrote there would load in every later one,
# and in running ones live, since Claude reloads it [docs]. So each session
# has its own, seeded with the declared keys alone from what the account
# keeps (`~/.omh/creds/claude/<account>/preferences/`), and `~/.claude.json`'s
# own preference keys likewise in its copy above. What the session changes
# among them reaches the account through the review; nothing else does.
#
# `file`: one file mounted per copy. Claude saves `settings.json` by writing a
# file beside it and renaming it over; refused through a single-file mount, it
# writes the file in place, which lands in the session's copy, same inode
# [measured in #197 at a terminal; `claude plugin marketplace add`, which
# writes user settings, on Docker Desktop and on Linux in the nightly — e2e].
#
# The keys, each read in the 2.1.300 binary where Claude reads it [bin]:
# `modelSettings` holds per-model `effortLevel`, `maxEffortLevel` and
# `autoCompactWindow` and nothing else, so it is declared whole; `advisorModel`
# is a model; `tui`, `editorMode`, `verbose` and `theme` are plain values, a
# `custom:` theme naming a colours-only file. `theme` and `verbose` live in
# `settings.json` at 2.1.300 [measured]. What a preference never is, whatever
# a later release adds — hooks, permissions, plugins, `env`, `attribution` —
# is `adapter::NEVER`.
[preferences]
mount = "file"

[preferences.files]
"$HOME/.claude/settings.json" = [
  "model",
  "advisorModel",
  "modelSettings",
  "effortLevel",
  "editorMode",
  "tui",
  "theme",
  "verbose",
]
"$HOME/.claude.json" = [
  "copyFullResponse",
  "copyOnSelect",
  "defaultToAgentsView",
  "leftArrowOpensAgents",
  "prStatusFooterEnabled",
  "respectGitignore",
]
