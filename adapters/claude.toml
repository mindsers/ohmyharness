name    = "claude"
bin     = "claude"
install = "npm install -g @anthropic-ai/claude-code"
# The whole config directory, not the token file: a bind-mounted *file* cannot
# be replaced by rename, and every tool saves its token by writing a temp file
# and renaming over it. omh prepares mountpoints for the capabilities that live
# inside this directory.
creds   = ["$HOME/.claude/", "$HOME/.claude.json"]

# A capability this harness cannot express is simply an absent key.
# What proves a login: a harness fills its config dir just by starting.
token   = ["$HOME/.claude/.credentials.json"]

login   = "run `/login` inside Claude Code, then exit"

[capabilities.rules]
path   = "/work/CLAUDE.md"
also   = ["/work/AGENTS.md"]  # CLAUDE.md wins where both exist; same bytes either way
render = "concat"

[capabilities.skills]
path   = "$HOME/.claude/skills"
render = "dir"

[capabilities.mcp]
path   = "$HOME/.mcp.json"
render = "mcp-json"
import = "$REPO/.mcp.json"   # project-scoped; ~/.claude.json nests by project

[capabilities.commands]
path   = "$HOME/.claude/commands"
render = "dir"

[capabilities.subagents]
path   = "$HOME/.claude/agents"
render = "dir"

[capabilities.hooks]
path   = "$HOME/.claude/settings.json"
render = "claude-settings"

# How this harness spells each word of omh's hook vocabulary. A hook is authored
# once, in omh's words; everything below is where that stops being portable.
# An absent entry means this harness has no such moment — the hooks wanting it
# are dropped by name, and the rest still ship.

[capabilities.hooks.events]
session-start = "SessionStart"   # re-fires on resume and compact, not once
turn-end      = "Stop"
before-tool   = "PreToolUse"
after-tool    = "PostToolUse"

[capabilities.hooks.tools]
edit   = "Edit|Write|MultiEdit"
read   = "Read"
shell  = "Bash"
search = "Grep|Glob"

# Where each canonical field lives in this harness's stdin schema.
[capabilities.hooks.fields]
tool-file    = ".tool_input.file_path"
tool-command = ".tool_input.command"

# `hookSpecificOutput.additionalContext` is the documented channel a hook uses
# to reach the model. Bare stdout on exit 0 is not, and the first version of the
# grep nudge wrote there — it may never have been seen.
[capabilities.hooks.inject]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","additionalContext":$m}}'"""
