name    = "claude"
bin     = "claude"
# Pinned so a rebuild reproduces the harness it was built against, and a bump
# moves the image tag. Maintainer bumps `version` to the release under test;
# omh's own build (which needs a container runtime) and `omh doctor` are where
# a wrong pin is caught, not `cargo test`.
version = "2.0.14"
install = "npm install -g @anthropic-ai/claude-code@{{version}}"
# The whole config directory, not the token file: a bind-mounted *file* cannot
# be replaced by rename, and every tool saves its token by writing a temp file
# and renaming over it. omh prepares mountpoints for the capabilities that live
# inside this directory.
creds   = ["$HOME/.claude/", "$HOME/.claude.json"]

# A capability this harness cannot express is simply an absent key.
# What proves a login: a harness fills its config dir just by starting.
token   = ["$HOME/.claude/.credentials.json"]

login   = "run `/login` inside Claude Code, then exit"

# How this harness names the things an agent does. Adapter-level rather than
# per-capability: hooks match on these, the Agent Skills standard carries them
# in `allowed-tools`, and subagent frontmatter carries them in `tools`. One
# vocabulary, spelled once.
[tools]
edit   = "Edit|Write|MultiEdit"
read   = "Read"
shell  = "Bash"
search = "Grep|Glob"

[capabilities.rules]
path   = "/work/CLAUDE.md"
also   = ["/work/AGENTS.md"]  # CLAUDE.md wins where both exist; same bytes either way
render = "concat"
# The **personal** memory file, never the repo's. `rules::compose` already puts
# this project's own CLAUDE.md into every session, so importing that one would
# deliver the same prose twice — once as yours, once as the project's.
import = "$HOME/.claude/CLAUDE.md"

[capabilities.skills]
path   = "$HOME/.claude/skills"
render = "dir"
# Textually the same as `path` and not derived from it: `path` is where the
# *container* reads, `import` where the host keeps yours. The two expand
# differently, and deriving one from the other is wrong for MCP.
import = "$HOME/.claude/skills"

# Project-scoped, because that is the only file of this shape Claude Code reads.
# `$HOME/.mcp.json` was the binding here until `verify` below was able to ask:
# omh rendered it correctly and mounted it faithfully, and the harness never
# opened it — user scope for this harness lives *inside* `~/.claude.json`, nested
# per project, and a bare `~/.mcp.json` is read by nothing.
#
# Mounted over the worktree rather than written into it, the way `rules` is, so
# git has nothing to report. That does mean the mount hides a project's own
# `.mcp.json`: `omh settings mcp import` is how those servers come along,
# deliberately a
# command someone runs rather than a merge that happens quietly.
[capabilities.mcp]
path   = "/work/.mcp.json"
render = "mcp-json"
import = "$REPO/.mcp.json"   # the same path on the host, read before the mount hides it
verify = "claude mcp list"
ready  = "Connected"

[capabilities.commands]
path   = "$HOME/.claude/commands"
render = "dir"
import = "$HOME/.claude/commands"

[capabilities.subagents]
path   = "$HOME/.claude/agents"
render = "dir"
import = "$HOME/.claude/agents"

[capabilities.hooks]
path   = "$HOME/.claude/settings.json"
render = "claude-settings"
import = "$HOME/.claude/settings.json"   # host-side, where `omh import hooks` reads

# How this harness spells each word of omh's hook vocabulary. A hook is authored
# once, in omh's words; everything below is where that stops being portable.
# An absent entry means this harness has no such moment — the hooks wanting it
# are dropped by name, and the rest still ship.

[capabilities.hooks.events]
session-start = "SessionStart"   # re-fires on resume and compact, not once
turn-end      = "Stop"
before-tool   = "PreToolUse"
after-tool    = "PostToolUse"

# Where each canonical field lives in this harness's stdin schema.
[capabilities.hooks.fields]
tool-file    = ".tool_input.file_path"
tool-command = ".tool_input.command"

# `hookSpecificOutput.additionalContext` is the documented channel a hook uses
# to reach the model. Bare stdout on exit 0 is not, and the first version of the
# grep nudge wrote there — it may never have been seen.
#
# Advisory: the tool call goes ahead. That is the whole difference from `refuse`
# below, and it is invisible in the text — which is why the *format* carries it.
[capabilities.hooks.inject]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","additionalContext":$m}}'"""

# Blocking, with a reason the model is shown. A different protocol from the one
# above rather than a flag on it, per https://code.claude.com/docs/en/hooks read
# 2026-08-13: `additionalContext` advises, `permissionDecision` decides.
#
# `deny` rather than exit 2. Both block, and the docs say exit 2 wins over any
# JSON — but exit 2 makes the *shell* the protocol, so a hook body that happened
# to exit 2 for its own reasons would block a call it never meant to. A decision
# said out loud is a decision omh can render and `omh why` can explain.
[capabilities.hooks.refuse]
template = """jq -nc --arg m {{text}} '{"hookSpecificOutput":{"hookEventName":"{{event}}","permissionDecision":"deny","permissionDecisionReason":$m}}'"""
